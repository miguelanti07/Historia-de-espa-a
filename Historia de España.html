/* ─── STORAGE ─────────────────────────────────────────── */
const LS_TACHADOS  = 'historia_tachados';
const LS_HISTORIAL = 'historia_historial';
const LS_POSICION  = 'historia_posicion';
const loadTachados = () => {
  try { return new Set(JSON.parse(localStorage.getItem(LS_TACHADOS) || '[]')); }
  catch { return new Set(); }
};
const saveTachados  = (s) => localStorage.setItem(LS_TACHADOS, JSON.stringify([...s]));
const loadHistorial = () => {
  try { return JSON.parse(localStorage.getItem(LS_HISTORIAL) || '[]'); }
  catch { return []; }
};
const saveHistorial = (h) => localStorage.setItem(LS_HISTORIAL, JSON.stringify(h));
const loadPosicion  = () => {
  const v = localStorage.getItem(LS_POSICION);
  return v !== null ? parseInt(v, 10) : -1;
};
const savePosicion  = (n) => localStorage.setItem(LS_POSICION, String(n));

/* ─── GLASS BUTTON ───────────────────────────────────── */
function GlassBtn({ onClick, disabled, children, accent, wide, style: extraStyle }) {
  const base = {
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    gap: 8, cursor: disabled ? 'not-allowed' : 'pointer',
    border: 'none', outline: 'none',
    fontFamily: 'inherit', fontWeight: 600, fontSize: 15,
    color: '#fff', borderRadius: 9999,
    transition: 'transform 0.12s ease, opacity 0.12s ease',
    opacity: disabled ? 0.3 : 1,
    userSelect: 'none',
    ...extraStyle,
  };
  const glassStyle = accent ? {
    background: 'linear-gradient(135deg, rgba(110,47,255,0.85) 0%, rgba(0,102,255,0.85) 100%)',
    boxShadow: '0 4px 24px rgba(100,60,255,0.45), inset 0 1px 0 rgba(255,255,255,0.25)',
    backdropFilter: 'blur(20px)',
    border: '1px solid rgba(255,255,255,0.2)',
  } : {
    background: 'rgba(255,255,255,0.08)',
    boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 12px rgba(0,0,0,0.3)',
    backdropFilter: 'blur(24px)',
    border: '1px solid rgba(255,255,255,0.14)',
  };

  return (
    <button
      onClick={disabled ? undefined : onClick}
      style={{ ...base, ...glassStyle }}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = 'scale(0.97)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
      onMouseDown={e => { if (!disabled) e.currentTarget.style.transform = 'scale(0.94)'; }}
      onMouseUp={e => { if (!disabled) e.currentTarget.style.transform = 'scale(0.97)'; }}
    >
      {children}
    </button>
  );
}

/* ─── MAIN APP ────────────────────────────────────────── */
function App() {
  const [tachados, setTachadosRaw]       = useState(loadTachados);
  const [historial, setHistorialRaw]     = useState(loadHistorial);
  const [posicion, setPosicionRaw]       = useState(loadPosicion);
  const [mostrarRespuesta, setMostrarRespuesta] = useState(false);
  const [animKey, setAnimKey]            = useState(0);

  const setTachados  = (s) => { saveTachados(s);  setTachadosRaw(s); };
  const setHistorial = (h) => { saveHistorial(h); setHistorialRaw(h); };
  const setPosicion  = (n) => { savePosicion(n);  setPosicionRaw(n); };

  const indiceActual = posicion >= 0 ? historial[posicion] : null;
  const actual       = indiceActual !== null ? preguntas[indiceActual] : null;
  const restantes    = preguntas.length - tachados.size;
  const completado   = restantes === 0;
  const puedeAnterior  = posicion > 0;
  const puedeSiguiente = restantes > 0;

  const bump = () => setAnimKey(k => k + 1);

  const sacarAleatoria = useCallback((tachadosActuales) => {
    const disponibles = preguntas
      .map((_, i) => i)
      .filter(i => !(tachadosActuales || tachados).has(preguntas[i].n));
    if (disponibles.length === 0) return;
    const aleatorio = disponibles[Math.floor(Math.random() * disponibles.length)];
    setHistorial(prev => {
      const nuevo = [...prev.slice(0, posicion + 1), aleatorio];
      saveHistorial(nuevo);
      return nuevo;
    });
    setPosicion(posicion + 1);
    setMostrarRespuesta(false);
    bump();
  }, [tachados, posicion]);

  const irAPregunta = (n) => {
    const idx = n - 1;
    const nuevo = [...historial.slice(0, posicion + 1), idx];
    setHistorial(nuevo);
    setPosicion(nuevo.length - 1);
    setMostrarRespuesta(false);
    bump();
  };

  const siguiente = () => {
    if (posicion < historial.length - 1) {
      setPosicion(posicion + 1);
      setMostrarRespuesta(false);
      bump();
    } else {
      sacarAleatoria(tachados);
    }
  };

  const anterior = () => {
    if (posicion > 0) {
      setPosicion(posicion - 1);
      setMostrarRespuesta(false);
      bump();
    }
  };

  const revelar = () => {
    setMostrarRespuesta(true);
    if (actual) {
      const nuevos = new Set(tachados);
      nuevos.add(actual.n);
      setTachados(nuevos);
    }
  };

  const reiniciar = () => {
    setTachados(new Set());
    setHistorial([]);
    setPosicion(-1);
    setMostrarRespuesta(false);
    bump();
  };

  // Keyboard nav
  useEffect(() => {
    const handler = (e) => {
      if (e.key === 'ArrowRight') siguiente();
      if (e.key === 'ArrowLeft') anterior();
      if ((e.key === ' ' || e.key === 'Enter') && !mostrarRespuesta) revelar();
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [posicion, historial, mostrarRespuesta, tachados]);

  const pct = (tachados.size / preguntas.length) * 100;

  return (
    <div style={{ position: 'relative', minHeight: '100vh', zIndex: 1 }}>

      {/* Blobs */}
      <div className="blob-stage">
        <div className="blob blob-1"></div>
        <div className="blob blob-2"></div>
        <div className="blob blob-3"></div>
        <div className="blob blob-4"></div>
      </div>

      {/* Content */}
      <div style={{ position: 'relative', zIndex: 2, maxWidth: 680, margin: '0 auto', padding: '48px 20px 80px' }}>

        {/* Header */}
        <header style={{ textAlign: 'center', marginBottom: 36 }}>
          <div style={{
            display: 'inline-block',
            background: 'rgba(255,255,255,0.06)',
            border: '1px solid rgba(255,255,255,0.12)',
            backdropFilter: 'blur(20px)',
            borderRadius: 9999,
            padding: '6px 18px',
            marginBottom: 16,
          }}>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)' }}>
              Historia de España
            </span>
          </div>
          <h1 style={{
            fontSize: 'clamp(28px, 5vw, 42px)',
            fontWeight: 700,
            letterSpacing: '-0.03em',
            lineHeight: 1.1,
            background: 'linear-gradient(135deg, #e0d4ff 0%, #a78bfa 30%, #60a5fa 65%, #bfdbfe 100%)',
            WebkitBackgroundClip: 'text',
            WebkitTextFillColor: 'transparent',
            backgroundClip: 'text',
            marginBottom: 8,
          }}>
            Repaso
          </h1>
          <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.38)', fontWeight: 500 }}>
            {tachados.size} de {preguntas.length} preguntas vistas
          </p>
        </header>

        {/* Progress bar */}
        <div style={{
          height: 3,
          borderRadius: 9999,
          background: 'rgba(255,255,255,0.08)',
          marginBottom: 32,
          overflow: 'hidden',
        }}>
          <div style={{
            height: '100%',
            borderRadius: 9999,
            width: `${pct}%`,
            background: 'linear-gradient(90deg, #7c3aed, #2563eb, #60a5fa)',
            transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)',
          }} />
        </div>

        {/* Flashcard */}
        {actual ? (
          <div
            key={animKey}
            className="fade-up"
            style={{
              background: 'rgba(255,255,255,0.06)',
              border: '1px solid rgba(255,255,255,0.13)',
              backdropFilter: 'blur(40px) saturate(200%)',
              WebkitBackdropFilter: 'blur(40px) saturate(200%)',
              borderRadius: 28,
              padding: 'clamp(24px, 4vw, 36px)',
              marginBottom: 24,
              boxShadow: '0 16px 48px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1)',
            }}
          >
            {/* Number badge + label */}
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 20 }}>
              <span style={{
                fontSize: 11, fontWeight: 600, letterSpacing: '0.1em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)',
                paddingTop: 4,
              }}>Pregunta</span>
              <span style={{
                fontSize: 52, fontWeight: 700, lineHeight: 1,
                background: 'linear-gradient(135deg, #a78bfa, #60a5fa)',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
              }}>
                {String(actual.n).padStart(2, '0')}
              </span>
            </div>

            {/* Question */}
            <h2 style={{
              fontSize: 'clamp(16px, 2.5vw, 19px)',
              fontWeight: 500,
              lineHeight: 1.5,
              color: 'rgba(255,255,255,0.92)',
              marginBottom: mostrarRespuesta ? 24 : 28,
              textWrap: 'pretty',
            }}>
              {actual.titulo}
            </h2>

            {/* Answer */}
            {mostrarRespuesta && (
              <div style={{
                background: 'rgba(255,255,255,0.04)',
                border: '1px solid rgba(255,255,255,0.09)',
                borderRadius: 18,
                padding: '20px 22px',
                marginBottom: 24,
              }}>
                <div style={{
                  fontSize: 10, fontWeight: 700, letterSpacing: '0.12em',
                  textTransform: 'uppercase', color: 'rgba(255,255,255,0.3)',
                  marginBottom: 12,
                }}>Respuesta</div>
                <p style={{
                  fontSize: 14,
                  lineHeight: 1.7,
                  color: 'rgba(255,255,255,0.78)',
                  whiteSpace: 'pre-line',
                  textWrap: 'pretty',
                }}>
                  {actual.respuesta}
                </p>
              </div>
            )}

            {/* Controls */}
            <div style={{ display: 'flex', gap: 10 }}>
              <GlassBtn
                onClick={anterior}
                disabled={!puedeAnterior}
                style={{ width: 50, height: 50, flexShrink: 0, borderRadius: 9999 }}
              >
                <IconChevLeft />
              </GlassBtn>

              {!mostrarRespuesta ? (
                <GlassBtn
                  onClick={revelar}
                  accent={true}
                  style={{ flex: 1, height: 50 }}
                >
                  <IconEye />
                  Revelar respuesta
                </GlassBtn>
              ) : (
                <div style={{
                  flex: 1, height: 50,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  borderRadius: 9999,
                  background: 'rgba(255,255,255,0.03)',
                  border: '1px solid rgba(255,255,255,0.08)',
                  color: 'rgba(255,255,255,0.35)',
                  fontSize: 13, fontWeight: 500,
                }}>
                  Revelada
                </div>
              )}

              <GlassBtn
                onClick={siguiente}
                disabled={!puedeSiguiente}
                style={{ width: 50, height: 50, flexShrink: 0, borderRadius: 9999 }}
              >
                <IconChevRight />
              </GlassBtn>
            </div>
          </div>
        ) : completado ? (
          /* ── Completed screen ── */
          <div style={{
            background: 'rgba(255,255,255,0.05)',
            border: '1px solid rgba(255,255,255,0.1)',
            backdropFilter: 'blur(40px)',
            borderRadius: 28,
            padding: '52px 24px',
            textAlign: 'center',
            marginBottom: 24,
          }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>🎉</div>
            <p style={{
              fontSize: 22, fontWeight: 700, marginBottom: 8,
              background: 'linear-gradient(135deg, #a78bfa, #60a5fa)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
            }}>¡Completado!</p>
            <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 14, marginBottom: 28 }}>
              Has visto las {preguntas.length} preguntas
            </p>
            <GlassBtn onClick={reiniciar} style={{ height: 44, paddingInline: 24, margin: '0 auto' }}>
              <IconReset /> Reiniciar
            </GlassBtn>
          </div>
        ) : (
          /* ── Start screen ── */
          <div style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center',
            gap: 12, marginBottom: 24,
          }}>
            <GlassBtn
              onClick={() => sacarAleatoria(tachados)}
              accent={true}
              style={{ height: 56, paddingInline: 36, fontSize: 16 }}
            >
              <IconShuffle />
              Pregunta aleatoria
            </GlassBtn>
            <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.28)' }}>
              o toca un número abajo
            </span>
          </div>
        )}

        {/* Question grid */}
        <div style={{
          background: 'rgba(255,255,255,0.04)',
          border: '1px solid rgba(255,255,255,0.1)',
          backdropFilter: 'blur(30px)',
          borderRadius: 24,
          padding: '20px 18px',
        }}>
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            marginBottom: 16, paddingInline: 2,
          }}>
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)' }}>
              Preguntas
            </span>
            {tachados.size > 0 && (
              <button
                onClick={reiniciar}
                style={{
                  background: 'none', border: 'none', cursor: 'pointer',
                  color: 'rgba(255,255,255,0.38)', fontSize: 12, fontWeight: 500,
                  display: 'flex', alignItems: 'center', gap: 5, fontFamily: 'inherit',
                  padding: '2px 0',
                }}
                onMouseEnter={e => e.currentTarget.style.color = 'rgba(255,255,255,0.7)'}
                onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.38)'}
              >
                <IconReset /> Reiniciar
              </button>
            )}
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(44px, 1fr))',
            gap: 6,
          }}>
            {preguntas.map((p) => {
              const visto = tachados.has(p.n);
              const esActual = actual?.n === p.n;
              return (
                <button
                  key={p.n}
                  onClick={() => irAPregunta(p.n)}
                  style={{
                    aspectRatio: '1',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 11, fontWeight: 600,
                    borderRadius: 12,
                    cursor: 'pointer',
                    border: 'none',
                    fontFamily: 'inherit',
                    transition: 'transform 0.1s ease, opacity 0.1s ease',
                    ...(esActual ? {
                      background: 'linear-gradient(135deg, rgba(110,47,255,0.9), rgba(37,99,235,0.9))',
                      color: '#fff',
                      boxShadow: '0 0 16px rgba(100,60,255,0.55)',
                      border: '1px solid rgba(255,255,255,0.2)',
                    } : visto ? {
                      background: 'rgba(255,255,255,0.03)',
                      color: 'rgba(255,255,255,0.2)',
                      border: '1px solid rgba(255,255,255,0.06)',
                      textDecoration: 'line-through',
                    } : {
                      background: 'rgba(255,255,255,0.07)',
                      color: 'rgba(255,255,255,0.75)',
                      border: '1px solid rgba(255,255,255,0.1)',
                    }),
                  }}
                  onMouseEnter={e => { if (!esActual) e.currentTarget.style.transform = 'scale(1.08)'; }}
                  onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; }}
                  onMouseDown={e => { e.currentTarget.style.transform = 'scale(0.93)'; }}
                  onMouseUp={e => { e.currentTarget.style.transform = 'scale(1.05)'; }}
                >
                  {p.n}
                </button>
              );
            })}
          </div>
        </div>

        {/* Footer hint */}
        <p style={{ textAlign: 'center', marginTop: 28, fontSize: 11, color: 'rgba(255,255,255,0.18)', letterSpacing: '0.05em' }}>
          ← → navegar · espacio revelar
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
